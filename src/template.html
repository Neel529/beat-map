<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f3d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beat Map</title>
<!--LEAFLET_CSS-->
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#17231c;--mute:#66706a;--line:#e1e4de;--brand:#1f3d2b;--brand2:#2f6b45;
--todo:#7b8580;--visit:#2563eb;--int:#d97706;--stock:#15803d;--no:#dc2626;--me:#2563eb;
--r:14px;--sh:0 6px 24px rgba(16,30,22,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#map{position:fixed;inset:0;z-index:0;background:#e9ece6}
/* top bar */
#top{position:fixed;z-index:500;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#searchBox{flex:1;position:relative}
#q{width:100%;height:46px;border:0;border-radius:23px;padding:0 16px 0 42px;background:var(--card);box-shadow:var(--sh);outline:none}
#searchBox svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--mute)}
#results{position:absolute;left:0;right:0;top:52px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);max-height:50vh;overflow:auto}
#results div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#results small{color:var(--mute);display:block}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;flex:0 0 46px}
.fab svg{width:22px;height:22px}
.fab.on{background:var(--brand);color:#fff}
.fab.me{width:56px;height:56px;flex-basis:56px;background:#2563eb;color:#fff}.fab.me.on{background:#1e40af;box-shadow:0 0 0 4px rgba(37,99,235,.3),var(--sh)}.fab.me svg{width:26px;height:26px}
.pillBtn{height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-end}
#rightBtns{align-items:flex-end}
#rightBtns{position:fixed;z-index:500;right:12px;display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
/* chips row */
#chips{position:fixed;z-index:499;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
select.chip{appearance:none;-webkit-appearance:none;padding-right:14px;font-weight:600;width:auto;max-width:180px;field-sizing:content}
.chip.on{background:var(--brand);color:#fff}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* sheet */
#sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;height:45vh;transition:height .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.drag{transition:none}
#sheetTop{touch-action:none;cursor:grab;user-select:none}
#handle{padding:10px 0 8px;display:grid;place-items:center;cursor:pointer;touch-action:none}
#handle b{width:42px;height:5px;border-radius:3px;background:#cfd4cc}
#tabs{display:flex;gap:4px;padding:0 12px 8px;border-bottom:1px solid var(--line)}
#tabs button{flex:1 1 auto;border:0;background:none;padding:8px 2px;border-radius:10px;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
#tabs button.on{background:#e8f0ea;color:var(--brand)}
#tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;margin-left:3px}
#body{flex:1;overflow:auto;padding:12px 14px 20px;overscroll-behavior:contain}
.h{font-weight:700;font-size:17px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:15px}
.btn.alt{background:#e8f0ea;color:var(--brand)}
.btn.line{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.big{height:52px;font-size:16px;flex:1}
.btn svg{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.next{border:2px solid var(--brand2);background:#f6faf7}
.list .it{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.list .it:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.num{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.grow{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
a.tel{color:var(--visit);font-weight:600;text-decoration:none;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eef1ec;color:var(--mute);margin-right:4px}
.pill.ok{background:#e3f4e8;color:var(--stock)}
.pill.warn{background:#fdf0dc;color:#9a5b00}
.bar{height:6px;border-radius:3px;background:#e6e9e3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--stock)}
.out{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;padding:6px;font-size:14px}
.out button.on{border-color:transparent;color:#fff}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input.f,textarea.f,select.f{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card)}
textarea.f{height:70px;padding:10px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.hist{font-size:13px;border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat div{background:#f3f5f1;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mute)}
.stat b{display:block;font-size:20px;color:var(--ink)}
#toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:var(--sh);max-width:92vw;display:flex;gap:10px;align-items:center}
#toast button{white-space:nowrap;flex:0 0 auto;background:#fff;color:var(--ink);border:0;border-radius:8px;height:34px;padding:0 12px;font-weight:600}
.pin{border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font:700 11px system-ui}
.pin.approx{border-style:dashed;border-color:#333;opacity:.85}
.mePulse{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.leaflet-control-attribution{font-size:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
#crossPin{position:fixed;z-index:450;left:50%;top:40%;transform:translate(-50%,-100%);pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
 <div id="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Search shops" autocomplete="off"><div id="results" hidden></div></div>
</div>
<div id="chips"></div>
<div id="rightBtns">
 <button class="pillBtn" id="bAdd" title="New shop where I am">+ New shop</button>
 <button class="fab me" id="bMe" title="Show my location" aria-label="Show my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div id="sheet">
 <div id="sheetTop"><div id="handle"><b></b></div>
 <div id="tabs"><button data-t="beat" class="on">Beat</button><button data-t="near">Nearby</button><button data-t="pilot">Pilot</button><button data-t="fu">Follow-ups</button><button data-t="more">More</button></div></div>
 <div id="body"></div>
</div>
<div id="toast" hidden></div>
<!--LEAFLET_JS-->
<script>
const S=__DATA__;
const ST={todo:["Not visited","--todo"],visit:["Visited","--visit"],int:["Interested","--int"],stock:["Stocked","--stock"],no:["Not interested","--no"]};
const LN={P:"Patanjali",R:"Retail",M:"Medical"};
const OUT={order:["Order taken","stock"],sample:["Sample given","int"],pitch:["Interested, will decide","int"],callback:["Call back later","int"],away:["Owner not there","visit"],no:["Not interested","no"],closed:["Shop closed / gone","no"],reorder:["Re-order","stock"],price:["Price & margin shared","int"]};
const OUT_MAIN=["order","sample","pitch","callback","away","no","closed"];
// the test link (/dev/) keeps its own records, so testing can never touch the live ones
const DEV=/\/dev\//.test(location.pathname);
const LIVE_KEY="jaipurBeatMap.v1";
const KEY=DEV?"jaipurBeatMap.dev":LIVE_KEY;
const fresh=()=>({st:{},nt:{},fix:{},plans:[],lists:{P:true,R:true,M:true},log:{},fu:{},added:[],bk:null,active:null,skip:{},stF:""});
let D=fresh();
// loadErr: saved records exist but could not be read. Saving is blocked so they are never overwritten.
let loadErr=false,saveFail=false;
try{const raw=localStorage.getItem(KEY);if(raw){try{const s=JSON.parse(raw);if(!s||typeof s!=="object"||Array.isArray(s))throw 0;D=Object.assign(D,s)}catch(e){loadErr=true;try{localStorage.setItem(KEY+".unreadable",raw)}catch(e2){}}}}catch(e){loadErr=true}
D.skip=D.skip||{};
function save(){
 if(loadErr){toast("<b>Not saved.</b> Your saved records could not be read, so nothing is being written over them. Close this page and tell Claude.",null,null,20000,1);return}
 try{localStorage.setItem(KEY,JSON.stringify(D));saveFail=false}
 catch(e){saveFail=true;toast("<b>Not saved.</b> The phone refused to store this change. Save a backup now.","Back up",()=>dl("beatmap-backup-"+today()+".json",JSON.stringify(D),"application/json"),20000,1)}}
function doBackup(){D.bk=Date.now();save();dl("beatmap-backup-"+today()+".json",JSON.stringify(D),"application/json")}
function isBackup(d){if(!d||typeof d!=="object"||Array.isArray(d))return false;if(!(d.log||d.st||d.inv))return false;
 if(["log","st","inv","fu","asm","fix"].some(k=>d[k]!=null&&(typeof d[k]!=="object"||Array.isArray(d[k]))))return false;
 if(["added","plans"].some(k=>d[k]!=null&&!Array.isArray(d[k])))return false;return true}
function cnt(d){const n=o=>Object.values(o||{}).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0);
 return{"Visits":n(d.log),"Stock entries":n(d.inv),"Shops with a status":Object.keys(d.st||{}).length,"Follow-ups":Object.keys(d.fu||{}).length,"Assessments":Object.keys(d.asm||{}).length,"Shops you added":(d.added||[]).length,"Pins you fixed":Object.keys(d.fix||{}).length}}
D.added.forEach(a=>S.push(a));
const byId={};S.forEach(s=>byId[s.id]=s);
D.plans.forEach(p=>p.ids=p.ids.filter(id=>byId[id]));D.plans=D.plans.filter(p=>p.ids.length);if(D.active!=null&&!D.plans[D.active])D.active=null;
const $=s=>document.querySelector(s);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pos=s=>D.fix[s.id]||[s.lat,s.lng];
const exact=s=>!!D.fix[s.id]||s.q===1;
const stOf=s=>D.st[s.id]||"todo";
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>dayKey(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayKey(d)};
const fmtT=t=>{const d=new Date(t);return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})};
function dist(a,b){const R=6371000,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const telA=ph=>`<a class="tel" href="tel:${esc(String(ph).replace(/[^+\d]/g,""))}" onclick="event.stopPropagation()">📞 ${esc(ph)}</a>`;
const fmtD=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(m<10000?1:0)+" km";
const IC={call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 18-8-8 18-2-8z"/></svg>',
ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12 5 5L20 7"/></svg>'};

// ---------- map
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView([26.89,75.79],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
const routeLayer=L.layerGroup().addTo(map);
let me=null,meAcc=null,meT=0,meMarker=null,meCircle=null,follow=false;
function pinIcon(s){
 const col=css(ST[stOf(s)][1]);const n=beatNum(s.id);const sz=n?26:16;
 const r=s.l==="M"?"4px":s.l==="P"?"3px":"50%";const rot=s.l==="M"?"transform:rotate(45deg);":"";
 const lab=n?`<span style="${s.l==="M"?"transform:rotate(-45deg)":""}">${n}</span>`:"";
 const pr=s.pc==="premium"?"box-shadow:0 0 0 3px #d4a017,0 1px 4px rgba(0,0,0,.4);":s.pc==="maybe"?"box-shadow:0 0 0 2px #e8c75a,0 1px 4px rgba(0,0,0,.4);":"";
 return L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div class="pin${exact(s)?"":" approx"}" style="width:${sz}px;height:${sz}px;background:${col};border-radius:${r};${rot}${pr}opacity:${s.c?1:.55}">${lab}</div>`});
}
const markers={};
function mk(s){const m=L.marker(pos(s),{icon:pinIcon(s)});m.on("click",()=>openStore(s.id));markers[s.id]=m;return m}
S.forEach(mk);
let chipF={list:null,st:""};
const _area={};function areaOf(s){if(s.area)return s.area;if(s.l!=="P"&&s.loc!=="Other")return s.loc;if(_area[s.id]!==undefined)return _area[s.id];let b=null,bd=1500;S.forEach(o=>{if(o.l==="P"||o.loc==="Other")return;const d=dist(pos(s),pos(o));if(d<bd){bd=d;b=o.loc}});return _area[s.id]=b}
function visible(s){if(!D.lists[s.l])return false;if(D.premF&&!(s.pc==="premium"||s.pc==="maybe"))return false;if(D.ayF&&s.ay!=="yes")return false;if(D.locF&&areaOf(s)!==D.locF)return false;if(D.stF&&stOf(s)!==D.stF)return false;return true}
function redraw(){layer.clearLayers();S.forEach(s=>{markers[s.id].setIcon(pinIcon(s));if(visible(s)||beatNum(s.id))layer.addLayer(markers[s.id])});drawChips();badge()}
function refreshOne(s){markers[s.id].setIcon(pinIcon(s));markers[s.id].setLatLng(pos(s))}

// chips
function zoomArea(){const pts=S.filter(visible).map(pos);if(pts.length)map.fitBounds(pts,{padding:[50,50],maxZoom:16})}
function drawChips(){
 const c=$("#chips");
 c.innerHTML=`<button class="chip${D.premF?" on":""}" id="premChip">★ Premium</button><button class="chip${D.ayF?" on":""}" id="ayChip">🌿 Ayurvedic shelf</button><select class="chip${D.locF?" on":""}" id="areaSel" aria-label="Area"><option value="">All areas ▾</option>${AREAS.map(a=>`<option${a===D.locF?" selected":""}>${esc(a)}</option>`).join("")}</select>`+Object.entries(LN).map(([k,v])=>`<button class="chip${D.lists[k]?" on":""}" data-l="${k}">${v}</button>`).join("")+
 Object.entries(ST).map(([k,v])=>`<button class="chip${D.stF===k?" on":""}" data-s="${k}"><i style="background:var(${v[1]})"></i>${v[0]}</button>`).join("");
 $("#premChip").onclick=()=>{D.premF=!D.premF;save();redraw();if(D.premF)zoomArea()};
 $("#ayChip").onclick=()=>{D.ayF=!D.ayF;save();redraw();if(D.ayF)zoomArea()};
 $("#areaSel").onchange=e=>{D.locF=e.target.value;save();redraw();zoomArea();if(tab==="near"||tab==="more")render(true)};
 c.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{D.lists[b.dataset.l]=!D.lists[b.dataset.l];save();redraw()});
 c.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{D.stF=D.stF===b.dataset.s?"":b.dataset.s;save();redraw()});
}

// ---------- location
function onPos(p){
 me=[p.coords.latitude,p.coords.longitude];meAcc=p.coords.accuracy;meT=Date.now();
 if(!meMarker){meMarker=L.marker(me,{icon:L.divIcon({className:"",iconSize:[18,18],html:'<div class="mePulse"></div>'}),zIndexOffset:1000}).addTo(map);meCircle=L.circle(me,{radius:p.coords.accuracy,color:"#2563eb",weight:1,fillOpacity:.08}).addTo(map)}
 else{meMarker.setLatLng(me);meCircle.setLatLng(me).setRadius(p.coords.accuracy)}
 if(follow)map.panTo(me);
 checkArrive();
 if(tab==="near"||tab==="beat")softRender();
}
let watching=false;
function startWatch(){if(watching||!navigator.geolocation)return;watching=true;navigator.geolocation.watchPosition(onPos,e=>{watching=false;toast("Location is off. Allow location for this site in your browser settings.")},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
$("#bMe").onclick=()=>{if(!watching)watching=false,startWatch();navigator.geolocation&&navigator.geolocation.getCurrentPosition(onPos,()=>{},{enableHighAccuracy:true,timeout:15000});if(me){follow=!follow;$("#bMe").classList.toggle("on",follow);map.setView(me,Math.max(map.getZoom(),16))}else{follow=true;$("#bMe").classList.add("on")}};
startWatch();
map.on("dragstart",()=>{if(follow){follow=false;$("#bMe").classList.remove("on")}});

// ---------- toast
let tT,tHold=0;function toast(html,btn,fn,ms=4500,hold){if(!hold&&Date.now()<tHold)return;if(hold)tHold=Date.now()+ms;const t=$("#toast");t.innerHTML=`<span>${html}</span>`+(btn?`<button>${btn}</button>`:"");t.hidden=false;if(btn)t.querySelector("button").onclick=()=>{t.hidden=true;fn()};clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,ms)}

// ---------- sheet
const sheet=$("#sheet");let tab="beat",view=null; // view: {k:'store',id} | {k:'log',id}
// draggable bottom sheet: snaps to map-only / half / full, or stays where you leave it
const snaps=()=>[$("#sheetTop").offsetHeight+4,Math.round(innerHeight*.45),Math.round(innerHeight*.92)];
let sheetH=null;
function setH(h,anim=true){const s=snaps();h=Math.max(s[0],Math.min(s[2],h));sheetH=h;sheet.classList.toggle("drag",!anim);sheet.style.height=h+"px";placeFabs()}
function setSheet(m){const s=snaps();setH(m==="min"?s[0]:m==="full"?s[2]:s[1])}
function isFull(){return sheetH>=snaps()[2]-4}function isMin(){return sheetH<=snaps()[0]+4}
function placeFabs(){const h=sheetH||sheet.offsetHeight;$("#rightBtns").style.bottom=(h+12)+"px";$("#rightBtns").style.display=h>innerHeight*.75?"none":"flex"}
addEventListener("resize",()=>setH(sheetH||innerHeight*.45));
let dg=null;
$("#sheetTop").addEventListener("pointerdown",e=>{dg={y:e.clientY,h:sheet.offsetHeight,moved:false,t:Date.now()};});

function beatNum(id){const p=D.active!=null&&D.plans[D.active];if(!p)return 0;const i=p.ids.indexOf(id);return i>=0?i+1:0}
function order(ids,start){
 if(ids.length<2)return ids.slice();
 const P=ids.map(id=>pos(byId[id]));
 let s0;if(start){let bd=1e18;P.forEach((p,i)=>{const d=dist(start,p);if(d<bd){bd=d;s0=i}})}else{s0=0;P.forEach((p,i)=>{if(p[1]-p[0]<P[s0][1]-P[s0][0])s0=i})}
 const left=new Set(P.map((_,i)=>i));left.delete(s0);const r=[s0];
 while(left.size){const c=P[r[r.length-1]];let b=null,bd=1e18;left.forEach(i=>{const d=dist(c,P[i]);if(d<bd){bd=d;b=i}});r.push(b);left.delete(b)}
 let imp=true,g=0;while(imp&&g++<60){imp=false;for(let i=1;i<r.length-1;i++)for(let k=i+1;k<r.length;k++){const a=P[r[i-1]],b=P[r[i]],c=P[r[k]],d=k+1<r.length?P[r[k+1]]:null;if(dist(a,c)+(d?dist(b,d):0)+1e-6<dist(a,b)+(d?dist(c,d):0)){r.splice(i,k-i+1,...r.slice(i,k+1).reverse());imp=true}}}
 return r.map(i=>ids[i]);
}

function makeBeats(lo){
 const n=D.pn||10;const taken=new Set(D.plans.flatMap(p=>p.ids));
 const pool=S.filter(s=>s.loc===lo&&D.lists[s.l]&&!taken.has(s.id)&&stOf(s)==="todo");
 if(!pool.length){toast("Nothing left to plan there with the current filters.");return}
 const tour=order(pool.map(s=>s.id));const ch=[];for(let i=0;i<tour.length;i+=n)ch.push(tour.slice(i,i+n));
 if(ch.length>1&&ch[ch.length-1].length<Math.ceil(n/3))ch[ch.length-2].push(...ch.pop());
 const short=lo.replace(/\s*\(.*\)/,"");let k=D.plans.filter(p=>p.name.startsWith(short)).length;
 ch.forEach(c=>D.plans.push({name:short+" · Beat "+(++k),ids:order(c)}));save();
 map.fitBounds(pool.map(pos),{padding:[60,60],maxZoom:16});toast(`${ch.length} beat${ch.length>1?"s":""} made for ${esc(short)}.`);render();
}

let routeInfo="";
async function drawRoute(){
 routeLayer.clearLayers();routeInfo="";const p=D.active!=null&&D.plans[D.active];if(!p)return;
 const pts=(me?[me]:[]).concat(remaining(p).map(id=>pos(byId[id])));if(pts.length<2)return;
 const straight=L.polyline(pts,{color:"#1f3d2b",weight:3,opacity:.5,dashArray:"6 8"}).addTo(routeLayer);
 try{const u="https://router.project-osrm.org/route/v1/driving/"+pts.slice(0,25).map(x=>x[1].toFixed(6)+","+x[0].toFixed(6)).join(";")+"?overview=full&geometries=geojson";
  const r=await fetch(u);const j=await r.json();if(j.code!=="Ok")throw 0;
  routeLayer.clearLayers();
  L.polyline(j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]),{color:"#fff",weight:9,opacity:.9}).addTo(routeLayer);
  L.polyline(j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]),{color:"#2f6b45",weight:5}).addTo(routeLayer);
  routeInfo=`${(j.routes[0].distance/1000).toFixed(1)} km by road · about ${Math.round(j.routes[0].duration/60)} min driving`;render(true);
 }catch(e){routeInfo="";}
}

const ASMQ=[
 {k:"demand",l:"Existing Chyawanprash demand",o:["None","Occasional","Regular"]},
 {k:"base",l:"Relevant customer base",o:["Weak","Moderate","Strong"]},
 {k:"rel",l:"Customer relationships",o:["Transactional","Moderate","Strong"]},
 {k:"rec",l:"Willing to recommend",o:["Unwilling","Unsure","Enthusiastic"]},

 {k:"cat",l:"Shop category",o:["Medical","Kirana","Ayurvedic","Premium grocery","Other"]},

 {k:"repeat",l:"Repeat customers for this kind of product",num:1,unk:1},
 {k:"recommends",l:"Actively recommends products?",o:["Yes","Sometimes","No"]},
 {k:"premium",l:"Already sells premium food / wellness?",o:["Yes","Some","No"]}];
const INVT={consign:["Consignment (pay after sale)",1],purchase:["Purchased by retailer",1],sample:["Free samples",0],tasting:["Used for tasting",-1],sale:["Customer sale (paid)",-1],return:["Returned to you",-1],damage:["Damaged",-1],adjust:["Adjustment",0]};
const NEXT=["Revisit","Call","Do a tasting","Deliver stock","Review sales","Collect payment","Nothing for now"];
// visit outcomes: [label, status, stage]
Object.assign(OUT,{
 intro:["First introduction done","visit","pre"],away:["Owner unavailable","visit","pre"],tasted:["Retailer tasted product","int","pre"],
 price:["Price discussed","int","pre"],margin:["Margin discussed","int","pre"],interested:["Interested","int","pre"],
 declined:["Declined","no","pre"],agreed:["Agreed to pilot","int","pre"],
 delivered:["Stock delivered","stock","pilot"],sampling:["Sampling started","stock","pilot"],review:["Sales reviewed","stock","pilot"],
 feedback:["Customer feedback collected","stock","pilot"],reorder:["Reorder received","stock","pilot"],rejected:["Rejected / deprioritised","no","pilot"]});
const OUT_PRE=["intro","away","tasted","price","margin","interested","agreed","declined"];
const OUT_PILOT=["delivered","sampling","review","feedback","reorder","rejected"];
const NEXT_DEF={intro:["Revisit",7],away:["Revisit",1],tasted:["Revisit",3],price:["Revisit",3],margin:["Revisit",3],interested:["Do a tasting",3],declined:["Nothing for now",""],agreed:["Deliver stock",2],
 delivered:["Review sales",7],sampling:["Review sales",7],review:["Review sales",7],feedback:["Review sales",7],reorder:["Deliver stock",1],rejected:["Nothing for now",""]};
D.asm=D.asm||{};D.inv=D.inv||{};D.dec=D.dec||{};D.perf=D.perf||{};

function qual(id){
 const a=(D.asm[id]||{}).sc||{};let score=0,known=0;const missing=[];
 ASMQ.forEach(q=>{const v=a[q.k];if(v===0||v===1||v===2){score+=v;known++}else missing.push(q.l)});
 const gate=a.rec===2&&a.taste===2;
 let cat,next;
 if(!known){cat="Not assessed";next="Do the assessment on your next visit"}
 else if(known<6){cat=`Incomplete (${known}/6)`;next="Fill the missing answers: "+missing.join(", ")}
 else if(score<=5){cat="Deprioritise";next="Don't spend more visits here for now"}
 else if(score<=8){cat="Follow up";next="Revisit to raise willingness or learn more"}
 else if(gate){cat="Eligible for pilot";next="Consider offering trial stock"}
 else{cat="Strong, but not eligible";next="Needs 2/2 on both 'recommend' and 'tastings' before stock"}
 return{score,known,missing,gate,cat,next,complete:known===6};
}
function inv(id){
 const tx=D.inv[id]||[];const t={consign:0,purchase:0,sample:0,tasting:0,sale:0,return:0,damage:0,adjust:0};
 let first=null,reorders=0,lastSale=null,lastReview=null;
 tx.forEach(x=>{t[x.type]+=x.qty;if((x.type==="consign"||x.type==="purchase")){if(!first||x.d<first)first=x.d;if(x.r)reorders++}if(x.type==="sale"&&(!lastSale||x.d>lastSale))lastSale=x.d});
 (D.log[id]||[]).forEach(v=>{if(v.out==="review"){const d=dayKey(v.t);if(!lastReview||d>lastReview)lastReview=d}});
 const supplied=t.consign+t.purchase;
 const remaining=supplied+t.adjust-t.tasting-t.sale-t.return-t.damage;
 const saleable=supplied-t.tasting-t.damage;
 const st=saleable>0?Math.round(t.sale/saleable*100):null;
 const days=first?Math.floor((new Date(today())-new Date(first))/864e5):null;
 return{...t,supplied,remaining,saleable,st,first,days,reorders,lastSale,lastReview,n:tx.length};
}
const daysSince=d=>d?Math.floor((new Date(today())-new Date(d))/864e5):null;
const PERF=["Not yet tested","Trial underway","Sales demonstrated","Reorder demonstrated","Inactive / underperforming"];
function perfAuto(id){const i=inv(id);if(!i.supplied)return"Not yet tested";if(i.reorders>0)return"Reorder demonstrated";
 if(i.sale>0)return daysSince(i.lastSale)>30&&i.remaining>0?"Inactive / underperforming":"Sales demonstrated";
 return i.days>=21?"Inactive / underperforming":"Trial underway"}
const DECS=["Reject / Deprioritise","Follow up","Eligible for pilot","Pilot active","Increase inventory","Hold inventory","Stop supplying"];
function lastOut(id){const l=D.log[id];return l&&l.length?l[l.length-1].out:null}
function suggest(id){
 const q=qual(id),i=inv(id),lo=lastOut(id);
 if(lo==="declined"||lo==="rejected")return["Reject / Deprioritise","Last visit: "+OUT[lo][0]];
 if(!i.supplied){
  if(q.cat==="Eligible for pilot")return["Eligible for pilot",`Score ${q.score}/12 and 2/2 on recommend + tastings. No stock yet.`];
  if(q.cat==="Deprioritise")return["Reject / Deprioritise",`Score ${q.score}/12.`];
  return["Follow up",q.known<6?`Assessment ${q.known}/6 done.`:`Score ${q.score}/12 (${q.cat}).`]}
 const base=`${i.sale} paid of ${i.saleable} saleable jars sold (${i.st??0}%), stock given ${i.days} day${i.days===1?"":"s"} ago`;
 if(i.reorders>0)return["Increase inventory",`${i.reorders} reorder${i.reorders>1?"s":""}. `+base+"."];
 if(i.st>=60)return["Increase inventory","Most of the stock sold: "+base+"."];
 if(!i.sale){if(i.days<14)return["Pilot active","No paid sales yet, still early: "+base+"."];
  if(i.days<=45)return["Hold inventory","No paid sales yet. Find out why: "+base+"."];
  return["Stop supplying","No movement for over 45 days: "+base+"."]}
 if(daysSince(i.lastSale)>45)return["Hold inventory",`Last paid sale ${daysSince(i.lastSale)} days ago. `+base+"."];
 return["Pilot active","Selling, keep watching: "+base+"."];
}

const gpsOk=()=>me&&Date.now()-meT<60000;
function qaLoc(){if(!gpsOk())return'<span style="color:#9a5b00">📍 Finding your location… (you can still save)</span>';
 const a=Math.round(meAcc||0);return a<=50?`<span style="color:var(--stock)">📍 Location found (±${a} m)</span>`:`<span style="color:#9a5b00">📍 Rough location (±${a} m). Pin will be dashed; fix it next visit.</span>`}
function qaNear(){if(!gpsOk())return[];const nm=qa.name.trim().toLowerCase();
 return S.filter(s=>{const d=dist(me,pos(s));return d<60||(nm.length>=3&&d<1500&&(s.n+" "+(s.old||"")).toLowerCase().includes(nm))}).sort((a,b)=>dist(me,pos(a))-dist(me,pos(b))).slice(0,4)}
function qaDraw(){const n=$("#qaNear");if(!n)return;$("#qaLoc").innerHTML=qaLoc();const L=qaNear();
 n.innerHTML=L.length?`<div class="sub" style="margin-top:12px">Already on the map? Tap it instead:</div><div class="list">${L.map(s=>`<div class="it" data-qn="${s.id}"><span class="dot" style="background:var(${ST[stOf(s)][1]})"></span><div class="grow"><div class="nm">${esc(s.n)}</div><div class="sub">${LN[s.l]} · ${fmtD(dist(me,pos(s)))} away</div></div><span class="btn sm alt">Log visit</span></div>`).join("")}</div>`:"";
 n.querySelectorAll("[data-qn]").forEach(x=>x.onclick=()=>{clearInterval(qaTimer);openLog(x.dataset.qn)})}
function qaddView(b){
 b.innerHTML=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="btn sm line" id="qaX">‹ Cancel</button><span class="sub" id="qaLoc">${qaLoc()}</span></div>
 <div class="h" style="margin-top:10px">New shop</div>
 <label class="f" for="qaN">Shop name</label><input class="f" id="qaN" placeholder="e.g. Sharma Kirana" autocomplete="off" value="${esc(qa.name)}">
 <label class="f">Type</label><div class="out" style="grid-template-columns:1fr 1fr 1fr" id="qaT">${QT.map((x,i)=>`<button data-i="${i}" class="${qa.ty===i?"on":""}" style="${qa.ty===i?"background:var(--brand)":""}">${x[1]}</button>`).join("")}</div>
 <details style="margin-top:10px"><summary class="sub" style="cursor:pointer">Phone, landmark (optional)</summary>
  <label class="f" for="qaP">Phone</label><input class="f" id="qaP" inputmode="tel" value="${esc(qa.ph)}">
  <label class="f" for="qaL">Landmark</label><input class="f" id="qaL" value="${esc(qa.lm)}"></details>
 <div class="sub" id="qaE" style="color:var(--no)">${esc(qa.err)}</div>
 <button class="btn big" id="qaS" style="width:100%;margin-top:12px">Save &amp; log visit</button>
 <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn sm line" id="qaO">Save only</button><button class="btn sm line" id="qaM">Place pin on map instead</button></div>
 <div id="qaNear"></div>`;
 const N=$("#qaN");N.oninput=()=>{qa.name=N.value;qaDraw()};$("#qaP").oninput=e=>qa.ph=e.target.value;$("#qaL").oninput=e=>qa.lm=e.target.value;
 b.querySelectorAll("#qaT button").forEach(x=>x.onclick=()=>{qa.ty=+x.dataset.i;b.querySelectorAll("#qaT button").forEach(y=>{const on=y===x;y.classList.toggle("on",on);y.style.background=on?"var(--brand)":""})});
 $("#qaX").onclick=()=>{clearInterval(qaTimer);view=null;setSheet("");render()};
 $("#qaM").onclick=()=>{clearInterval(qaTimer);addOnMap()};
 $("#qaS").onclick=()=>qaSave(true);$("#qaO").onclick=()=>qaSave(false);
 if(!qa.name)setTimeout(()=>N.focus(),50);
 clearInterval(qaTimer);qaTimer=setInterval(()=>{if(!view||view.k!=="qadd"){clearInterval(qaTimer);return}qaDraw()},1500);qaDraw();
}
function qaSave(andLog){const n=qa.name.trim(),e=$("#qaE");
 if(!n){e.textContent="Type the shop name.";$("#qaN").focus();return}
 if(qa.ty==null){e.textContent="Pick a type.";return}
 const good=gpsOk();const ll=good?me.map(x=>+x.toFixed(6)):(c=>[+c.lat.toFixed(6),+c.lng.toFixed(6)])(map.getCenter());
 const exactPin=good&&meAcc<=50;const [l,,cat]=QT[qa.ty];
 let near=null,bd=1e18;S.forEach(s=>{if(s.l==="P")return;const d=dist(ll,pos(s));if(d<bd){bd=d;near=s}});
 const s={id:"N"+Date.now().toString(36),l,n,t:"Added on the ground",a:qa.lm.trim(),loc:near?near.loc:"Other",area:"",s:"Added by you",ph:qa.ph.trim(),
  no:good?"":"Saved without GPS: pin is where the map was. Fix it next visit.",c:1,lat:ll[0],lng:ll[1],q:exactPin?1:0,acc:good?Math.round(meAcc):null,at:new Date().toISOString()};
 D.added.push(s);S.push(s);byId[s.id]=s;D.asm[s.id]={sc:{},biz:{cat}};save();mk(s);redraw();clearInterval(qaTimer);
 if(andLog)openLog(s.id);else{openStore(s.id);setSheet("")}
 toast(exactPin?"Shop added ✓":"Shop added. Pin is approximate: tap “I'm here, fix pin” next visit.")}

// ---------- boot
drawChips();redraw();setSheet("");render();
{const n=Object.values(D.log).reduce((a,v)=>a+v.length,0)+Object.values(D.inv).reduce((a,v)=>a+v.length,0);const bd=D.bk?(Date.now()-D.bk)/864e5:null;if(n&&(bd==null||bd>=3))setTimeout(()=>toast(bd==null?"Your pilot data isn't backed up yet.":"Last backup "+Math.floor(bd)+" days ago.","Back up",doBackup,10000),1500)}
if(DEV){document.title="Beat Map · TEST";$("#q").placeholder="Search shops · TEST COPY"}
if(loadErr)toast("<b>Your saved records could not be read.</b> Nothing has been deleted and nothing will be saved until this is fixed. Close this page and tell Claude.",null,null,60000,1);
else{let m=null;try{m=sessionStorage.getItem("bmMsg");sessionStorage.removeItem("bmMsg")}catch(e){}if(m)toast(esc(m),null,null,8000,1)}
// ask the browser not to clear these records on its own
if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persisted=!!p;if(tab==="more"&&!view)render(true)}).catch(()=>{});
if(D.active!=null&&D.plans[D.active]){drawRoute();map.fitBounds(D.plans[D.active].ids.map(id=>pos(byId[id])),{padding:[60,60],maxZoom:17})}
</script>
</body>
</html>
